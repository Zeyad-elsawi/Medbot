name: Deploy to Koyeb

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'koyeb.yaml'

jobs:
  deploy-backend:
    name: Trigger Koyeb Redeploy
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Koyeb Deploy via API
        env:
          KOYEB_API_TOKEN: ${{ secrets.KOYEB_API_TOKEN }}
          KOYEB_SERVICE_ID: ${{ secrets.KOYEB_SERVICE_ID }}
        run: |
          curl -s -X POST \
            "https://app.koyeb.com/v1/services/${KOYEB_SERVICE_ID}/redeploy" \
            -H "Authorization: Bearer ${KOYEB_API_TOKEN}" \
            -H "Content-Type: application/json"
          echo "✅ Koyeb redeploy triggered"
